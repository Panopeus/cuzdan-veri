name: Piyasa verisi
  on:
    schedule:
      - cron: "30 6,8,10 * * 1-5"   # 09:30, 11:30, 13:30 TR
      - cron: "45 12 * * 1-5"       # 15:45 TR, TCMB bülteninden sonra
      - cron: "30 14 * * 1-5"       # 17:30 TR
    workflow_dispatch:
  permissions:
    contents: write
    pages: write
    id-token: write
  concurrency:
    group: market
    cancel-in-progress: false
  jobs:
    update:
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deploy.outputs.page_url }}
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: node fetch.mjs
          env:
            METALCHARTS_KEY: ${{ secrets.METALCHARTS_KEY }}
            EVDS_KEY: ${{ secrets.EVDS_KEY }}
        - run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/market.json
            git diff --cached --quiet || (git commit -m "Piyasa verisi $(date -u +%F)" && git push)
        - uses: actions/configure-pages@v5
        - uses: actions/upload-pages-artifact@v3
          with:
            path: site
        - id: deploy
          uses: actions/deploy-pages@v4
